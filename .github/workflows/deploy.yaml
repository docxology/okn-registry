name: Build and deploy MkDocs

permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    outputs:
      publish: ${{ steps.pages.outputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.4"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Snakemake
        run: uv tool install snakemake

      - name: Run registry tests
        run: uv run --locked python -m unittest discover

      - name: Build query diagrams
        run: snakemake -c2 --show-failed-logs build_query_docs

      - name: Build the site
        run: uv run --locked mkdocs build

      - name: Check whether this fork publishes Pages
        if: github.event_name == 'push'
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish=$(gh api "repos/$GITHUB_REPOSITORY" --jq '(.fork != true or .has_pages != false)')
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [[ "$publish" == "false" ]]; then
            echo "The site built successfully. This fork has GitHub Pages disabled." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifact
        if: steps.pages.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
